name: Update Contribution Galaxy

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_galaxy.py"
      - "requirements-galaxy.txt"
      - ".github/workflows/contribution-galaxy.yml"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  galaxy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-galaxy.txt

      - name: Generate galaxy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: manjulpandey17
        run: python scripts/generate_galaxy.py

      - name: Commit generated galaxy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-galaxy.gif
          git diff --cached --quiet || git commit -m "chore: update contribution galaxy"
          git push
