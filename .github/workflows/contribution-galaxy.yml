name: Update Contribution Galaxy

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_galaxy.py"
      - "requirements-galaxy.txt"
      - ".github/workflows/contribution-galaxy.yml"
  schedule:
    # GitHub contributions can take a little time to appear; refresh every 30 minutes.
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: contribution-galaxy
  cancel-in-progress: true

jobs:
  galaxy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-galaxy.txt

      - name: Generate galaxy + activity dashboard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: manjulpandey17
        run: python scripts/generate_galaxy.py

      - name: Commit generated visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-galaxy.gif assets/github-activity.svg
          if git diff --cached --quiet; then
            echo "Activity visuals unchanged"
            exit 0
          fi
          git commit -m "chore: update GitHub activity visuals"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
