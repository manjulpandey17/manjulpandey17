name: Generate Contribution Snake

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/snake.yml"
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: manjulpndey
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Copy generated snake into profile assets
        run: |
          mkdir -p assets
          cp dist/github-contribution-grid-snake.svg assets/github-contribution-grid-snake.svg
          cp dist/github-contribution-grid-snake-dark.svg assets/github-contribution-grid-snake-dark.svg

      - name: Commit generated snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake.svg assets/github-contribution-grid-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution snake unchanged"
            exit 0
          fi
          git commit -m "chore: update contribution snake"
          git pull --rebase origin main
          git push origin HEAD:main
